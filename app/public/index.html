<!DOCTYPE html>
<html>
<head>
<title>Charaoke</title>
<script src="js/main.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<img src="images/charaoke_logo.png">
<div>
  <button type="button" class="mode" onclick="modeButtonClicked('beat')">Beat Mode</button>
  <button type="button" class="mode" onclick="modeButtonClicked('lyric')">Lyric Mode</button>
</div>

<!--Add in additional functionality when we add in account system-->
<div>
  <button type="button" id="account">Log In</button>
</div>

<div>
  <h2>How to Play:</h2>
  <ol>
    <li>Click "Lyric Mode"</li>
    <li>Search for a song</li>
    <li>Click on the song you want to play</li>
    <li>Once the screen changes, start typing the lyrics as they fall</li>
    <li>Your score will be automatically shown on screen</li>
  </ol>
</div>
</body>
</html>
