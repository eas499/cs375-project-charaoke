<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
    </head>
    <body>
        <button id="menu" onclick="mainMenu()">Back to main menu</button>
        <h3 id="score">Waiting for score...</h3>
        <label>Name</label>
        <input type="text" id="name">
        <button id="submit" onclick="submitScore()">Submit score</button>
        <table>
            <tr><th>Ranking</th><th>Name</th><th>Score</th></tr>
            <tbody id="leaderboard"></tbody>
        </table>
        <p id="message">Submit score to see rankings</p>
        <script src="js/end.js"></script>
    </body>
</html>
